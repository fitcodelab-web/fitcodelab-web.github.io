<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Guest Links</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* Personal invite links for the couple (4 Nov 2026). Nothing is sent from here: each WhatsApp button only opens a draft. */
:root { --maroon: #7a1f2b; --gold: #b8893b; --ivory: #fbf5ea; --ink: #4a1a22 }
* { box-sizing: border-box; margin: 0 }
body { background: var(--ivory); color: var(--ink); font: 500 17px 'Cormorant Garamond', serif; padding: 24px 16px 60px }
main { max-width: 560px; margin: 0 auto }
h1 { font: 44px 'Great Vibes', cursive; color: var(--maroon); text-align: center }
p.lead { text-align: center; margin: 4px 0 18px }
label { display: block; font: 600 11px 'Cinzel', serif; letter-spacing: 2px; color: var(--maroon); margin: 14px 0 6px }
textarea, input { width: 100%; padding: 12px; border: 1px solid #d9bfa8; border-radius: 10px; font: inherit; background: #fff }
textarea { min-height: 140px }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.seg input { position: absolute; opacity: 0 }
.seg span { display: block; padding: 11px; text-align: center; border: 1px solid #d9bfa8; border-radius: 10px; background: #fff; font-weight: 600; cursor: pointer }
.seg input:checked + span { background: var(--maroon); color: #fbe9c8; border-color: var(--maroon) }
.row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; padding: 10px 0; border-bottom: 1px dashed rgba(184, 137, 59, .4) }
.row b { font-weight: 600; overflow-wrap: anywhere }
.row a, .row button { padding: 8px 12px; border-radius: 20px; border: 1px solid var(--gold); background: #fff; color: var(--maroon); font: 600 10px 'Cinzel', serif; letter-spacing: 1px; text-decoration: none; cursor: pointer }
.row a.wa { background: #1f8f4e; border-color: #1f8f4e; color: #fff }
#out { margin-top: 18px }
.note { font-size: 15px; color: #7d4a4f; margin-top: 16px }
</style>
</head>
<body>
<main>
  <h1>Guest Links</h1>
  <p class="lead">One personal link per guest. It opens with “Dear <i>name</i>”.</p>
  <label for="names">GUEST NAMES (ONE PER LINE)</label>
  <textarea id="names" placeholder="Arya&#10;Sharma Family&#10;Mr. &amp; Mrs. Gupta"></textarea>
  <label>WHOSE GUESTS?</label>
  <div class="seg">
    <label style="margin:0;letter-spacing:0"><input type="radio" name="side" value="groom" checked><span>Shwetang’s side</span></label>
    <label style="margin:0;letter-spacing:0"><input type="radio" name="side" value="bride"><span>Dimpy’s side</span></label>
  </div>
  <label for="msg">WHATSAPP MESSAGE (EDIT IF YOU LIKE)</label>
  <textarea id="msg" style="min-height:90px">Dear {name}, with great joy we invite you to our wedding celebrations on 1st & 2nd December 2026 at Hotel Ortus, Kota. Your personal invitation: {link}</textarea>
  <div id="out"></div>
  <p class="note">The WhatsApp button only opens a draft in WhatsApp; you choose the contact and press send yourself. Replies arrive in the RSVP sheet with the name from the link.</p>
</main>
<script>
const base = new URL('./', location.href).href;
const $ = (s) => document.querySelector(s);
function render() {
  const side = document.querySelector('[name=side]:checked').value;
  const names = $('#names').value.split('\n').map((s) => s.replace(/[<>{}]/g, '').trim()).filter(Boolean);
  $('#out').innerHTML = '';
  for (const n of names) {
    const link = base + '?to=' + encodeURIComponent(n) + (side === 'bride' ? '&side=bride' : '');
    const text = $('#msg').value.replaceAll('{name}', n).replaceAll('{link}', link);
    const row = document.createElement('div'); row.className = 'row';
    const b = document.createElement('b'); b.textContent = n;
    const open = document.createElement('a'); open.href = link; open.target = '_blank'; open.rel = 'noopener'; open.textContent = 'PREVIEW';
    const copy = document.createElement('button'); copy.textContent = 'COPY';
    copy.onclick = async () => { try { await navigator.clipboard.writeText(link); copy.textContent = 'COPIED'; } catch (e) { prompt('Copy this link', link); } };
    const wa = document.createElement('a'); wa.className = 'wa'; wa.target = '_blank'; wa.rel = 'noopener'; wa.textContent = 'WHATSAPP';
    wa.href = 'https://wa.me/?text=' + encodeURIComponent(text);
    row.append(b, open, copy, wa); $('#out').append(row);
  }
}
['input', 'change'].forEach((e) => document.addEventListener(e, render));
render();
</script>
</body>
</html>
